<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin</title>
<style>
:root{--bg:#0f1a2b;--panel:#16243a;--text:#e9eef5;--muted:#9fb0c5;--accent:#6fd0c0;--line:#27395a}
@media (prefers-color-scheme:light){:root{--bg:#f3f6fa;--panel:#fff;--text:#12203a;--muted:#55657d;--accent:#0b7d6e;--line:#d5dde8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:24px}
label{display:block;margin:14px 0 4px;color:var(--muted);font-size:14px}
input[type=text],input[type=email],input[type=password],input[type=url],textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.chk{display:flex;gap:8px;align-items:center;margin:14px 0 4px;color:var(--text)}
button{padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#06241f;font-weight:600;cursor:pointer;margin:16px 8px 0 0}
button.g{background:none;color:var(--text);border:1px solid var(--line)}button.d{background:#c0392b;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row button{margin:0 0 0 6px;padding:6px 12px}
#msg{margin-top:12px;color:var(--accent)}.hide{display:none}
</style></head><body><div class="w">
<h1>Portfolio admin</h1>
<div id="login">
<label>Email</label><input type="email" id="em"><label>Password</label><input type="password" id="pw">
<button id="in">Sign in</button></div>

<div id="app" class="hide">
<button class="g" id="out">Sign out</button> <a href="index.html" style="color:var(--accent)">View site</a>
<h2 id="ft">Add project</h2>
<label>Title</label><input type="text" id="title">
<label>Description</label><textarea id="desc" rows="3"></textarea>
<label>Tags (comma separated)</label><input type="text" id="tags" placeholder="Website, Responsive">
<label>Live site link (optional)</label><input type="url" id="live">
<div class="chk"><input type="checkbox" id="desk"><label for="desk" style="margin:0;color:var(--text)">Desktop app (no screenshot, no public site)</label></div>
<div class="chk"><input type="checkbox" id="showcode"><label for="showcode" style="margin:0;color:var(--text)">Show "Code" button</label></div>
<div id="codebox" class="hide"><label>Code link (GitHub repo)</label><input type="url" id="code"></div>
<label>Screenshot: upload a file</label><input type="file" id="file" accept="image/*">
<label>or paste an image link (leave both empty to auto-capture from the live site)</label><input type="url" id="img">
<button id="save">Save project</button><button class="g hide" id="cancel">Cancel edit</button>
<div id="msg"></div>
<h2>Your projects</h2><div id="items"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
let editing=null,rows=[];
const say=t=>$('msg').textContent=t;
$('showcode').onchange=()=>$('codebox').classList.toggle('hide',!$('showcode').checked);
async function gate(){const{data}=await sb.auth.getSession();const ok=!!data.session;
 $('login').classList.toggle('hide',ok);$('app').classList.toggle('hide',!ok);if(ok)list();}
$('in').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
 if(error)alert('Login failed: '+error.message);else gate();};
$('out').onclick=async()=>{await sb.auth.signOut();gate();};
async function list(){const{data,error}=await sb.from('projects').select('*').order('created_at',{ascending:false});
 if(error){say(error.message);return;}rows=data;$('items').innerHTML='';
 rows.forEach(p=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<span></span><span><button class="g">Edit</button><button class="d">Delete</button></span>';
  d.firstChild.textContent=p.title;const[b1,b2]=d.querySelectorAll('button');
  b1.onclick=()=>edit(p);b2.onclick=()=>del(p);$('items').appendChild(d);});}
function edit(p){editing=p.id;$('ft').textContent='Edit project';$('title').value=p.title||'';$('desc').value=p.description||'';
 $('tags').value=p.tags||'';$('live').value=p.live_url||'';$('desk').checked=!!p.is_desktop;
 $('showcode').checked=!!p.code_url;$('codebox').classList.toggle('hide',!p.code_url);$('code').value=p.code_url||'';
 $('img').value=p.image_url||'';$('cancel').classList.remove('hide');scrollTo(0,0);}
function reset(){editing=null;$('ft').textContent='Add project';['title','desc','tags','live','code','img'].forEach(i=>$(i).value='');
 $('desk').checked=$('showcode').checked=false;$('codebox').classList.add('hide');$('file').value='';$('cancel').classList.add('hide');}
$('cancel').onclick=reset;
async function del(p){if(!confirm('Delete "'+p.title+'"?'))return;
 const{error}=await sb.from('projects').delete().eq('id',p.id);say(error?error.message:'Deleted');list();}
$('save').onclick=async()=>{
 if(!$('title').value.trim()){say('Title is required');return;}
 say('Saving...');let image=$('img').value.trim();const f=$('file').files[0];
 if(f){const path=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');
  const{error}=await sb.storage.from('project-images').upload(path,f);
  if(error){say('Upload failed: '+error.message);return;}
  image=sb.storage.from('project-images').getPublicUrl(path).data.publicUrl;}
 const row={title:$('title').value.trim(),description:$('desc').value.trim(),tags:$('tags').value.trim(),
  live_url:$('live').value.trim()||null,is_desktop:$('desk').checked,
  code_url:$('showcode').checked?($('code').value.trim()||null):null,image_url:image||null};
 const q=editing?sb.from('projects').update(row).eq('id',editing):sb.from('projects').insert(row);
 const{error}=await q;if(error){say(error.message);return;}
 say('Saved');reset();list();};
gate();
</script></body></html>
