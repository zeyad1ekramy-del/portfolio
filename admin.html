<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- بيمنع جوجل من فهرسة صفحة الأدمن -->
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head><body><div class="w">

<h1>Portfolio admin</h1>

<!-- ============ تسجيل الدخول (بيظهر لو مش مسجل) ============ -->
<div id="login">
  <label>Email</label><input type="email" id="em">
  <label>Password</label><input type="password" id="pw">
  <button id="in">Sign in</button>
</div>

<!-- ============ لوحة التحكم (بتظهر بعد تسجيل الدخول) ============ -->
<div id="app" class="hide">
  <button class="g" id="out" style="margin-top:0">Sign out</button>
  <a href="index.html" style="color:var(--accent)">View site</a>

  <!-- معلومات الموقع: الصورة الشخصية + الاسم + About + التواصل
       (خانات الاسم وغيرها بتتولد من js/admin.js داخل #sform) -->
  <div class="box"><h2>Site info</h2>
    <label>Profile photo (shown in the About circle) — upload a file</label>
    <input type="file" id="av_f" accept="image/*">
    <label for="av_u">or paste an image link</label>
    <input type="url" id="av_u">
    <img id="av_p" alt="">
    <p class="hint">The photo is cropped to a square and resized automatically. Click "Save site info" to apply it.</p>
    <button class="g" id="av_rm" type="button" style="margin-top:6px">Remove photo</button>

    <div id="sform"></div>
    <button id="ssave">Save site info</button>
    <div class="msg" id="smsg"></div>
  </div>

  <!-- إضافة/تعديل مشروع (خانات المشروع بتتولد من js/admin.js داخل #pform و #iform) -->
  <div class="box"><h2 id="ft">Add project</h2>
    <div id="pform"></div>
    <div class="chk"><input type="checkbox" id="desk"><label for="desk">Desktop app (no public site, no auto screenshot)</label></div>
    <div class="chk"><input type="checkbox" id="showcode"><label for="showcode">Show "Code" button</label></div>
    <div id="codebox" class="hide"><label>Code link (GitHub repo)</label><input type="url" id="code"></div>
    <button class="g" id="auto" type="button">Auto-fill from links</button>
    <span class="hint" id="amsg">Fill the live link (and the code link for languages), then click. It fills only empty fields.</span>
    <div id="iform"></div>
    <button id="save">Save project</button>
    <button class="g hide" id="cancel">Cancel edit</button>
    <div class="msg" id="msg"></div>
  </div>

  <!-- الرسائل اللي جاتلك من فورم التواصل -->
  <div class="box"><h2>Messages</h2><div id="msgs"></div></div>

  <!-- قائمة المشاريع الحالية -->
  <h2>Your projects</h2>
  <div id="items"></div>
</div>

</div>

<!-- السكريبتات (الترتيب مهم) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/admin.js"></script>
</body></html>
